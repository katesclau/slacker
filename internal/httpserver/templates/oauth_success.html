<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connected · Slacker</title>
  <style>
    :root {
      --ink: #1b1f24;
      --muted: #5c6570;
      --blue: #3b5bdb;
      --card: #fffdf8;
      --bg: #f3efe6;
      --line: #e4ddd0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, #fff8e8 0, transparent 40%),
        radial-gradient(circle at 90% 90%, #d9e3ff 0, transparent 42%),
        var(--bg);
      color: var(--ink);
    }
    .card {
      width: min(440px, calc(100vw - 32px));
      padding: 40px 36px 32px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(59, 91, 219, 0.12);
      text-align: center;
    }
    img {
      width: 112px;
      height: 112px;
      object-fit: contain;
    }
    h1 {
      margin: 20px 0 8px;
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 16px;
    }
    .server {
      display: inline-block;
      margin: 8px 0 20px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #eef2ff;
      color: var(--blue);
      font-weight: 600;
      font-size: 13px;
    }
    .hint {
      font-size: 13px;
      color: #8a8380;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="{{.LogoSrc}}" alt="Slacker">
    <h1>You're connected</h1>
    <span class="server">{{.Server}}</span>
    <p>Slacker's got this. Head back to Slack — your original request is already being picked up in the thread.</p>
    <p class="hint">You can close this tab.</p>
  </main>
</body>
</html>
